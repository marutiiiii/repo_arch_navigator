
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: repo_arch_backend
    ports:
      - "5000:5000"
    env_file:
      - ./backend/.env
    environment:
      - PORT=5000
      - FLASK_ENV=development
    volumes:
      # Live reload: sync backend code changes from host without rebuilding
      - ./backend:/app
      # Avoid overwriting container's installed venv/packages
      - /app/__pycache__

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: repo_arch_frontend
    ports:
      - "8080:8080"
    environment:
      # Browser connects to backend via localhost from your machine
      - VITE_API_URL=http://localhost:5000
    volumes:
      # Live reload: sync frontend code changes without rebuilding
      - ./src:/app/src
      - ./public:/app/public
      - ./index.html:/app/index.html
      # Prevent host node_modules from overwriting container node_modules
      - /app/node_modules
    depends_on:
      - backend
